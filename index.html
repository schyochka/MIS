<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Медичний помічник</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="МедПомічник">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#000;--panel:#111;--line:#262626;--text:#eee;--muted:#8a8a8a;--accent:#b3202e;--user:#3a1218;--bot:#161616}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
header img{width:34px;height:34px;border-radius:8px}
header h1{font-size:17px;margin:0;flex:1}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.5}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--user)}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line)}
.bot h3,.bot h4{margin:.6em 0 .2em}
.bot ul,.bot ol{margin:.3em 0;padding-left:1.3em}
.bot p{margin:.4em 0}
.bot table{border-collapse:collapse;margin:.5em 0;font-size:14px}
.bot td,.bot th{border:1px solid var(--line);padding:4px 8px}
.err{color:#ff7b7b;align-self:center;font-size:14px}
.empty{color:var(--muted);text-align:center;margin:auto;padding:24px}
.empty img{width:96px;border-radius:20px;margin-bottom:12px}
footer{padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:#000a}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input,select{width:100%;font:inherit;color:var(--text);background:#000;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}.chk input{width:auto}
small{color:var(--muted)}
#lock{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lock.on{display:flex}
#lock img{width:96px;border-radius:20px}
#lock input{max-width:300px;text-align:center;font-size:20px;letter-spacing:4px}
#lock .msgl{color:#ff7b7b;min-height:1.4em;font-size:14px}
#lock .hint{color:var(--muted);font-size:14px;max-width:320px}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="icon-192.png" alt="">
    <h1>Медичний помічник</h1>
    <button id="newBtn" title="Нова розмова">Нова</button>
    <button id="setBtn" title="Налаштування">⚙</button>
  </header>
  <div id="chat"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Опишіть випадок: вік, стать, скарги, обстеження…"></textarea>
    <button id="send" class="primary">Надіслати</button>
  </footer>
</div>

<div id="lock">
  <img src="icon-192.png" alt="">
  <h2 id="lockTitle" style="margin:0">Медичний помічник</h2>
  <div class="hint" id="lockHint"></div>
  <input id="lkUrl" type="url" placeholder="Адреса сервера (https://….workers.dev)" autocomplete="off" style="display:none;max-width:340px;font-size:15px;letter-spacing:0">
  <input id="lkPin" type="password" inputmode="text" placeholder="Код доступу" autocomplete="off">
  <div class="msgl" id="lockMsg"></div>
  <button id="lkGo" class="primary" style="min-width:200px">Увійти</button>
  <button id="lkBio" style="display:none;min-width:200px">Face ID / відбиток</button>
</div>

<dialog id="settings">
  <h3 style="margin-top:0">Налаштування</h3>
  <button id="bioBtn" style="width:100%">Увімкнути Face ID / відбиток</button>
  <button id="lockNow" style="width:100%;margin-top:8px">Заблокувати зараз</button>
  <button id="logout" style="width:100%;margin-top:8px">Вийти (скинути код на цьому пристрої)</button>
  <label for="model">Модель</label>
  <select id="model">
    <option value="claude-sonnet-5-5">Sonnet 5.5 (швидко, економно)</option>
    <option value="claude-opus-5-5">Opus 5.5 (глибший аналіз)</option>
  </select>
  <div class="chk"><input type="checkbox" id="web"><label for="web" style="margin:0;color:var(--text)">Пошук в інтернеті (актуальні джерела)</label></div>
  <div class="row">
    <button id="closeSet">Закрити</button>
    <button id="saveSet" class="primary">Зберегти</button>
  </div>
</dialog>

<script>
const SYSTEM = `Ти — віртуальний медичний помічник для лікаря (користувач — медичний фахівець). Відповідай українською мовою.

Принципи роботи:
1. Користувач надсилає діагноз, скарги, дані обстежень. Ти аналізуєш їх і надаєш структуровану клінічну інформацію: диференційна діагностика, рекомендований обсяг обстежень, підходи до лікування, ризики, червоні прапорці.
2. У ПЕРШУ ЧЕРГУ орієнтуйся на уніфіковані клінічні протоколи (УКПМД) та накази МОЗ України, а також Національний перелік лікарських засобів. Коли посилаєшся на протокол, вказуй його назву та, за можливості, номер і рік наказу. Якщо не певен, що саме сказано в чинній версії протоколу, прямо скажи про це й запропонуй звірити з текстом на сайті МОЗ / Державного експертного центру.
3. Далі спирайся на міжнародні настанови (ESC, ESH, ADA, NICE, WHO тощо) та сучасні наукові публікації; зазначай рівень доказовості й рік, не вигадуй посилань, назв досліджень чи дозувань. Якщо є пошук в інтернеті, використовуй його для перевірки актуальності.
4. Якщо інформації замало для змістовного аналізу (немає віку, статі, тривалості скарг, анамнезу, супутніх захворювань, препаратів, алергій, життєвих показників, ключових аналізів) — спочатку постав уточнювальні запитання, а не гадай.
5. Дозування вказуй лише коли впевнений; якщо доза залежить від віку, ваги, функції нирок/печінки — зазнач це. Якщо українські й міжнародні рекомендації відрізняються — покажи обидві позиції.
6. Відповідай стисло й за структурою (заголовки, списки). Не повторюй загальних застережень у кожній відповіді; окремо попереджай лише про невідкладні стани та небезпечні взаємодії. Остаточне рішення завжди за лікарем.`;

const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send'), dlg = $('settings');
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let history = [];
try { history = JSON.parse(store.get('history', '[]')); } catch {}
let busy = false;

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inline(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:]|$)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(text){
  const lines = esc(text).split('\n'); let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (/^\s*\|.*\|\s*$/.test(l)) {
      close(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; } i--;
      out += '<table>' + rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, idx) => {
        const t = idx === 0 ? 'th' : 'td';
        return '<tr>' + r.trim().replace(/^\||\|$/g,'').split('|').map(c => `<${t}>${inline(c.trim())}</${t}>`).join('') + '</tr>';
      }).join('') + '</table>';
    }
    else if (l.trim() === '') { close(); }
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (role === 'user') d.textContent = text; else d.innerHTML = md(text);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function renderAll(){
  chat.innerHTML = '';
  if (!history.length) {
    chat.innerHTML = '<div class="empty"><img src="icon-192.png" alt=""><div>Надішліть діагноз, скарги або результати обстежень.<br>Орієнтуюсь передусім на уніфіковані клінічні протоколи МОЗ України.</div></div>';
    return;
  }
  history.forEach(m => add(m.role, m.content));
}
function save(){ store.set('history', JSON.stringify(history.slice(-40))); }

async function send(){
  const text = input.value.trim();
  if (!text || busy) return;
  if (locked || !store.get('pin', '')) { showLock(); return; }
  busy = true; sendBtn.disabled = true;
  if (!history.length) chat.innerHTML = '';
  history.push({ role: 'user', content: text });
  add('user', text); input.value = ''; input.style.height = 'auto';
  const bubble = add('bot', '…');
  let acc = '';
  try {
    const body = {
      model: store.get('model', 'claude-sonnet-5-5'),
      max_tokens: 4096,
      stream: true,
      system: SYSTEM,
      messages: history.slice(-30)
    };
    if (store.get('web', '1') === '1') body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
    const r = await fetch(store.get('url', ''), {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-access-pin': store.get('pin', '') },
      body: JSON.stringify(body)
    });
    if (r.status === 401) { store.set('pin', ''); locked = true; showLock(); throw new Error('Невірний код доступу'); }
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.error?.message || msg; } catch {}
      throw new Error(msg);
    }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n'); buf = parts.pop();
      for (const line of parts) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        let ev; try { ev = JSON.parse(data); } catch { continue; }
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          acc += ev.delta.text; bubble.innerHTML = md(acc); chat.scrollTop = chat.scrollHeight;
        } else if (ev.type === 'error') throw new Error(ev.error?.message || 'Помилка стріму');
      }
    }
    if (!acc) { bubble.remove(); throw new Error('Порожня відповідь'); }
    history.push({ role: 'assistant', content: acc }); save();
  } catch (e) {
    history.pop();
    if (!acc) bubble.remove();
    const er = document.createElement('div'); er.className = 'err';
    er.textContent = 'Помилка: ' + e.message + (/Failed to fetch|Load failed/.test(e.message) ? ' (перевірте інтернет)' : '');
    chat.appendChild(er); chat.scrollTop = chat.scrollHeight;
    if (!acc) input.value = text;
  } finally { busy = false; sendBtn.disabled = false; }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
$('newBtn').onclick = () => { if (!history.length || confirm('Почати нову розмову? Поточна буде видалена.')) { history = []; save(); renderAll(); } };
$('setBtn').onclick = () => { $('bioBtn').textContent = store.get('cred', '') ? 'Вимкнути Face ID / відбиток' : 'Увімкнути Face ID / відбиток'; $('model').value = store.get('model', 'claude-sonnet-5-5'); $('web').checked = store.get('web', '1') === '1'; dlg.showModal(); };
$('closeSet').onclick = () => dlg.close();
$('saveSet').onclick = () => { store.set('model', $('model').value); store.set('web', $('web').checked ? '1' : '0'); dlg.close(); };

/* ---------- Блокування: код доступу + Face ID / відбиток (WebAuthn) ---------- */
let locked = true;
const lock = $('lock'), lkPin = $('lkPin'), lkUrl = $('lkUrl'), lockMsg = $('lockMsg');
const b64 = {
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b))),
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
const bioSupported = () => !!(window.PublicKeyCredential && navigator.credentials);

function showLock(){
  const setup = !store.get('pin', '') || !store.get('url', '');
  locked = true; lock.classList.add('on'); lockMsg.textContent = ''; lkPin.value = '';
  lkUrl.style.display = setup ? '' : 'none';
  if (setup) lkUrl.value = store.get('url', '');
  $('lockHint').textContent = setup
    ? 'Перший вхід: вкажіть адресу сервера та код доступу (не коротше 8 символів).'
    : 'Введіть код доступу.';
  $('lkGo').textContent = setup ? 'Зберегти й увійти' : 'Увійти';
  $('lkBio').style.display = (!setup && store.get('cred', '')) ? '' : 'none';
  if (!setup && store.get('cred', '')) bioUnlock(true);
}
function unlock(){ locked = false; lock.classList.remove('on'); lkPin.value = ''; }

async function bioUnlock(silent){
  try {
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ id: b64.dec(store.get('cred', '')), type: 'public-key' }],
      userVerification: 'required', timeout: 60000
    }});
    unlock();
  } catch (e) { if (!silent) lockMsg.textContent = 'Біометрію не підтверджено. Введіть код.'; }
}
async function bioEnable(){
  if (!bioSupported()) { alert('Цей пристрій або браузер не підтримує Face ID / відбиток для вебзастосунків.'); return; }
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Медичний помічник', id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'doctor', displayName: 'Лікар' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000
    }});
    store.set('cred', b64.enc(c.rawId));
  } catch (e) { alert('Не вдалося увімкнути біометрію: ' + (e.message || e)); }
}

$('lkGo').onclick = async () => {
  const setup = !store.get('pin', '') || !store.get('url', '');
  const pin = lkPin.value;
  if (!pin) return;
  if (setup) {
    const url = lkUrl.value.trim();
    if (!/^https:\/\//.test(url)) { lockMsg.textContent = 'Вкажіть адресу сервера, що починається з https://'; return; }
    if (pin.length < 8) { lockMsg.textContent = 'Код має бути не коротшим за 8 символів.'; return; }
    lockMsg.textContent = 'Перевірка…';
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-access-pin': pin, 'x-check': '1' }, body: '{}' });
      if (r.status === 401) { lockMsg.textContent = 'Невірний код доступу.'; return; }
      if (!r.ok) { lockMsg.textContent = 'Сервер відповів помилкою ' + r.status; return; }
    } catch { lockMsg.textContent = 'Немає зв’язку із сервером. Перевірте адресу.'; return; }
    store.set('url', url); store.set('pin', pin); unlock();
    if (bioSupported() && confirm('Увімкнути вхід за Face ID / відбитком?')) await bioEnable();
  } else {
    if (pin === store.get('pin', '')) unlock(); else lockMsg.textContent = 'Невірний код.';
  }
};
lkPin.addEventListener('keydown', e => { if (e.key === 'Enter') $('lkGo').click(); });
$('lkBio').onclick = () => bioUnlock(false);
$('bioBtn').onclick = async () => {
  if (store.get('cred', '')) { store.set('cred', ''); } else { await bioEnable(); }
  $('bioBtn').textContent = store.get('cred', '') ? 'Вимкнути Face ID / відбиток' : 'Увімкнути Face ID / відбиток';
};
$('lockNow').onclick = () => { dlg.close(); showLock(); };
$('logout').onclick = () => {
  if (!confirm('Видалити код, адресу сервера, біометрію та історію розмови з цього пристрою?')) return;
  ['pin', 'url', 'cred', 'history'].forEach(k => store.set(k, ''));
  history = []; dlg.close(); renderAll(); showLock();
};
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000 && store.get('pin', '')) showLock();
});

renderAll();
showLock();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
